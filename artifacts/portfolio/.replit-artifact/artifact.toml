kind = "web"
previewPath = "/"
title = "Yash Bhati – Portfolio"
version = "1.0.0"
id = "artifacts/portfolio"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21113

[services.development]
run = '''node -e "const http=require('http'),fs=require('fs'),path=require('path');const root=process.cwd();http.createServer((req,res)=>{let p=path.join(root,decodeURIComponent(req.url.split('?')[0]));if(p.endsWith('/'))p+='index.html';if(!p.startsWith(root)||!fs.existsSync(p)||fs.statSync(p).isDirectory())p=path.join(root,'index.html');const types={'.html':'text/html','.css':'text/css','.js':'application/javascript'};res.setHeader('Content-Type',types[path.extname(p)]||'text/plain');res.end(fs.readFileSync(p));}).listen(process.env.PORT,'0.0.0.0')"'''

[services.production]
serve = "static"
publicDir = "artifacts/portfolio"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21113"
BASE_PATH = "/"
