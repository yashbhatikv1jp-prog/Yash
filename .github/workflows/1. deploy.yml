name: Deploy Website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build Portfolio
        working-directory: ./artifacts/portfolio
        env:
          PORT: "3000"
          BASE_PATH: "/Yash/"
        run: npx vite build --base=/Yash/ --outDir=dist

      - name: Copy Profile Photo and 404 page
        run: |
          cp ./artifacts/portfolio/dist/index.html ./artifacts/portfolio/dist/404.html
          cp ./attached_assets/profile_1784022713130.jpg ./artifacts/portfolio/dist/profile.jpg

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './artifacts/portfolio/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
