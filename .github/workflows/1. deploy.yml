name: Deploy Website to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build_and_deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.26.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter '@workspace/portfolio...'

      - name: Build Portfolio
        working-directory: ./artifacts/portfolio
        env:
          PORT: "4173"
          BASE_PATH: "/Yash/"
        run: pnpm exec vite build --config vite.config.ts --base=/Yash/ --outDir=dist

      - name: Prepare GitHub Pages output
        run: |
          set -euo pipefail
          cp ./artifacts/portfolio/dist/index.html ./artifacts/portfolio/dist/404.html
          test -s ./artifacts/portfolio/dist/profile.jpg
          test -s ./artifacts/portfolio/dist/sitemap.xml
          test -s ./artifacts/portfolio/dist/robots.txt

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './artifacts/portfolio/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
